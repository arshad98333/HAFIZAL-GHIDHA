name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: make check (lint, typecheck, fast tests)
        run: make check PYTHON=python

      - name: Coverage floor (domain rules)
        run: |
          python -m pytest tests/ --cov=cold_chain.domain.rules_engine --cov=cold_chain.domain.guardrails \
            --cov-fail-under=70 -q --ignore=tests/integration

  integration:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7.0.14
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Integration tests
        env:
          MONGODB_URI: mongodb://localhost:27017
        run: make test-integration PYTHON=python

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - name: Dependency audit
        run: pip-audit -r requirements.txt --strict

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t cold-chain-pipeline:ci .
      - name: Health check in container
        run: |
          docker run --rm \
            -e MONGODB_URI=mongodb://localhost:27017 \
            -e AZURE_OPENAI_ENDPOINT=https://example-test.services.ai.azure.com \
            -e FOUNDRY_PROJECT_ENDPOINT=https://example-test.services.ai.azure.com/api/projects/test \
            -e FOUNDRY_COMPUTE_CLUSTER=test-cluster \
            -e FOUNDRY_BASE_MODEL=test-org/test-base-model \
            -e TRAINING_REGION=test-region \
            cold-chain-pipeline:ci health

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run lint
          npm run build

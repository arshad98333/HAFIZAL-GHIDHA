name: Deploy Web + API

# Builds the React dashboard and FastAPI image, deploys to Azure Static Web Apps
# and Azure Container Apps (HTTP, scale-to-zero).
#
# Required GitHub secrets/variables (see DEPLOYMENT.md):
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#   AZURE_RESOURCE_GROUP, AZURE_STATIC_WEB_APPS_API_TOKEN
#   AZURE_API_APP_NAME (Container App name)
#   VITE_API_BASE_URL (optional override; otherwise fetched from deployed API)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "cold_chain/api/**"
      - "Dockerfile.api"
      - "infra/web-stack.json"
      - ".github/workflows/deploy-web.yml"

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  API_IMAGE_NAME: ${{ github.repository }}-api

jobs:
  build-api:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          IMAGE="${REGISTRY}/${API_IMAGE_NAME,,}"
          TAG="${GITHUB_SHA::12}"
          docker build -f Dockerfile.api -t "${IMAGE}:${TAG}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${TAG}"
          docker push "${IMAGE}:latest"
          echo "image=${IMAGE}:${TAG}" >> "$GITHUB_OUTPUT"

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || '/api' }}
        run: |
          npm ci 2>/dev/null || npm install
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  deploy-api:
    if: github.event_name == 'workflow_dispatch' && vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    needs: build-api
    environment: production
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/CLI@v2
        with:
          inlineScript: |
            az containerapp update \
              --name "${{ vars.AZURE_API_APP_NAME }}" \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --image "${{ needs.build-api.outputs.image }}"

  deploy-frontend:
    if: github.event_name == 'workflow_dispatch' && secrets.AZURE_STATIC_WEB_APPS_API_TOKEN != ''
    runs-on: ubuntu-latest
    needs: build-frontend
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontend/dist
          output_location: ""
          skip_app_build: true

  frontend-ci:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - working-directory: frontend
        run: |
          npm install
          npm run lint
          npm run build

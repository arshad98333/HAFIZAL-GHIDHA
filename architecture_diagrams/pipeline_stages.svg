<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 200" font-family="Segoe UI, system-ui, sans-serif">
  <rect width="960" height="200" fill="#f8f9fb"/>
  <text x="480" y="28" text-anchor="middle" font-size="18" font-weight="600" fill="#1a1a2e">Wave pipeline stages (resumable CLI)</text>

  <g font-size="12" font-weight="600">
    <rect x="20" y="70" width="100" height="48" rx="6" fill="#bbdefb" stroke="#1565c0"/>
    <text x="70" y="98" text-anchor="middle" fill="#0d47a1">plan</text>

    <rect x="150" y="70" width="120" height="48" rx="6" fill="#c8e6c9" stroke="#2e7d32"/>
    <text x="210" y="98" text-anchor="middle" fill="#1b5e20">generate</text>

    <rect x="300" y="70" width="100" height="48" rx="6" fill="#ffe0b2" stroke="#ef6c00"/>
    <text x="350" y="98" text-anchor="middle" fill="#e65100">gate-a</text>

    <rect x="430" y="70" width="80" height="48" rx="6" fill="#e1bee7" stroke="#7b1fa2"/>
    <text x="470" y="98" text-anchor="middle" fill="#4a148c">train</text>

    <rect x="540" y="70" width="100" height="48" rx="6" fill="#ffcdd2" stroke="#c62828"/>
    <text x="590" y="98" text-anchor="middle" fill="#b71c1c">gate-b</text>
  </g>

  <path d="M120 94 L150 94" stroke="#666" stroke-width="2" marker-end="url(#a)"/>
  <path d="M270 94 L300 94" stroke="#666" stroke-width="2" marker-end="url(#a)"/>
  <path d="M400 94 L430 94" stroke="#666" stroke-width="2" marker-end="url(#a)"/>
  <path d="M510 94 L540 94" stroke="#666" stroke-width="2" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#666"/></marker></defs>

  <text x="70" y="140" text-anchor="middle" font-size="10" fill="#555">curriculum</text>
  <text x="210" y="140" text-anchor="middle" font-size="10" fill="#555">simulate + label</text>
  <text x="350" y="140" text-anchor="middle" font-size="10" fill="#555">data quality</text>
  <text x="470" y="140" text-anchor="middle" font-size="10" fill="#555">Foundry SFT</text>
  <text x="590" y="140" text-anchor="middle" font-size="10" fill="#555">model eval</text>

  <text x="700" y="94" font-size="11" fill="#333">Each stage is a separate</text>
  <text x="700" y="112" font-size="11" fill="#333">Container Apps Job run:</text>
  <text x="700" y="136" font-size="10" font-family="monospace" fill="#1565c0">python -m cold_chain.runner &lt;stage&gt; --wave N</text>
</svg>
